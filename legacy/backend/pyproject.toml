# Tooling configuration for the Python backend (backend/*.py).
#
# This file configures ruff and pytest only. Runtime dependencies are listed in
# backend/requirements.txt; test and lint tools are pinned in
# backend/requirements-dev.txt. Run both from the backend/ directory:
#
#     python -m pip install -r requirements-dev.txt
#     python -m ruff check .
#     python -m pytest

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Correctness rules only: syntax errors, undefined names, unused imports and
# variables, and the pycodestyle checks that flag real mistakes. Style rules
# (line length, whitespace, import order) are off on purpose so that enabling
# lint does not reformat the parsers. Widen this set as the files are touched,
# not in one sweep.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
