name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Only the newest run per branch survives. Pushing several commits in a row used
# to leave every earlier run grinding to completion, and on a private repo each
# one bills minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The real ceiling. GitHub's default is SIX HOURS, and in September 2026 a
    # test script that started a server and never exited hit it fifteen times in
    # a row -- ninety hours of billed minutes on a private repo, which exhausted
    # the account's quota and stopped jobs starting at all. The suite finishes in
    # well under ten minutes; twenty-five is generous and bounds the damage.
    # scripts/run-tests.mjs now also caps each script individually.
    timeout-minutes: 25

    # Throwaway database so the Postgres round-trip test runs for real instead of
    # skipping. Without it, PgWorkspaceService is only ever checked structurally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Install Python PDF deps
        run: python -m pip install pdfplumber

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/omni_test

      - name: Build
        run: npm run build

      # The extension bundles are committed artifacts. This does not
      # regenerate them for the build -- tests/swimCloudExtensionBuildFreshness.test.ts
      # already fails when a committed bundle is stale. This step proves the
      # build script itself still runs on a clean checkout.
      - name: Build browser extension
        run: npm run build:extension
